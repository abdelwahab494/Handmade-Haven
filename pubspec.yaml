name: handmade
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  google_fonts: ^8.1.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_assets:
  assets_path:
    - assets/
  output_path: lib/core/manager/
  filename: app_assets.dart
  field_prefix:
  classname: AppAssets
  ignore_comments: true
